<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Export Successful
    </title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', path='css/style.css') }}"
    >

</head>

<body>

<div class="success-page">

    <div class="success-card">

        <div class="success-icon">
            ✓
        </div>

        <p class="tag">
            EXPORT COMPLETE
        </p>

        <h1>
            Your Comic is Ready!
        </h1>

        <p>
            Your ComicCraft PDF has been successfully created.
        </p>


        {% if filename %}

        <a
            href="/download/{{ filename }}"
            class="button"
        >
            Download PDF
        </a>

        {% endif %}


        <a
            href="/"
            class="secondary"
        >
            Create New Comic
        </a>

    </div>

</div>

</body>
</html>
